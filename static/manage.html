<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>系统管理</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260517-5" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>系统管理</h1>
            <p>账户权限、修改建议与样本数据管理</p>
          </div>
          <div class="actions">
            <a class="button secondary" href="/app">返回处理页</a>
          </div>
        </header>
        <section class="admin-card">
          <h2>账户管理</h2>
          <table class="admin-table">
            <thead>
              <tr><th>账户名称</th><th>采集数据数量</th><th>校核数据数量</th><th>权限</th></tr>
            </thead>
            <tbody id="statsBody"></tbody>
          </table>
        </section>

        <section class="admin-card admin-settings">
          <h2>多模态大模型配置</h2>
          <label>
            <span>URL</span>
            <input id="modelUrlInput" />
          </label>
          <label>
            <span>Model Name</span>
            <input id="modelNameInput" />
          </label>
          <label>
            <span>API Key</span>
            <input id="modelApiKeyInput" type="password" placeholder="留空则不修改现有 API Key" />
          </label>
          <div class="actions">
            <button id="saveModelConfig" type="button">保存模型配置</button>
            <span id="modelConfigStatus"></span>
          </div>
        </section>

        <section class="admin-card admin-settings">
          <h2>样本集路径配置</h2>
          <label>
            <span>绝对路径</span>
            <input id="sampleDatasetPathInput" />
          </label>
          <div class="actions">
            <button id="saveSampleDatasetPath" type="button">保存并移动样本集</button>
            <span id="sampleDatasetPathStatus"></span>
          </div>
        </section>

        <section class="admin-card">
          <h2>样本数据状态</h2>
          <table class="admin-table data-table">
            <thead>
              <tr><th>序号</th><th>数据来源</th><th>待审核样本数</th><th>已审核样本数</th><th>操作</th></tr>
            </thead>
            <tbody id="sampleDataStatusBody"></tbody>
          </table>
        </section>

        <section class="admin-card admin-settings">
          <h2>外观管理</h2>
          <label>
            <span>外观显示</span>
            <select id="appearanceSelect">
              <option value="standard">标准外观</option>
              <option value="simple">简洁外观</option>
            </select>
          </label>
          <div class="actions">
            <button id="saveAppearance" type="button">保存外观</button>
            <span id="appearanceStatus"></span>
          </div>
        </section>

        <section class="admin-card admin-settings">
          <h2>注册设置</h2>
          <label>
            <span>注册码</span>
            <input id="registerCodeInput" />
          </label>
          <div class="actions">
            <button id="saveRegisterCode" type="button">保存注册码</button>
            <span id="registerCodeStatus"></span>
          </div>
        </section>

        <section class="admin-card">
          <h2>修改建议</h2>
          <div id="suggestionsList" class="suggestions-list"></div>
        </section>
      </section>
    </main>
    <script src="/static/manage.js?v=20260520-4"></script>
  </body>
</html>
