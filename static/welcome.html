<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电力分析能力评测数据采集与标注系统</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260514-5" />
  </head>
  <body class="welcome-page">
    <main class="welcome-shell">
      <section class="welcome-hero">
        <h1>电力分析能力评测数据采集与标注系统</h1>
        <p>面向电力分析评测数据的采集、校核、标注与归档。</p>
      </section>
      <section class="auth-panel">
        <form id="loginForm" class="auth-form" method="post" action="/login-form">
          <label><span>用户名</span><input id="loginUser" name="username" autocomplete="username" /></label>
          <label><span>密码</span><input id="loginPass" name="password" type="password" autocomplete="current-password" /></label>
          <button type="submit">登录系统</button>
        </form>
        <a class="register-link" href="/register">注册新账户</a>
        <p id="authMessage" class="auth-message"></p>
      </section>
    </main>
  </body>
</html>
